---
# Every branch gets a pipeline, and the shellcheck job runs in each one: the
# project merges nothing without a green pipeline, so a change no other job
# reads (LICENSE, renovate.json) still needs one. Which other jobs are worth
# running is each job's own business, through its own `rules:`.
#
# `compare_to` is what makes `changes:` mean something stable. Without it the
# comparison is against the branch's previous push, so amending a commit
# message — an identical tree — matches nothing, and the job does not run.
#
# Every job is interruptible, so pushing again to a branch cancels the run it
# supersedes.
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Run when the listed paths changed against the default branch, and
# unconditionally on the default branch itself and on tags — where comparing
# main to main would match nothing.
.on-default-branch: &on-default-branch
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# No molecule job yet: the role has no scenario, see CONTRIBUTING.md.
# At the root, ansible-lint also reads the changelog and the Markdown linter's
# settings, which are YAML too.
ansible-lint:
  image: docker.io/gwerlas/ansible-lint:26.11.0
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - .markdownlint-cli2.yaml
          - .markdownlint.yaml
          - changelogs/**/*
          - defaults/**/*
          - meta/**/*
          - requirements.yml
          - tasks/**/*
          - vars/**/*
  script: ansible-lint

# The same lint, on the role as a user installs it, under `roles/<name>/`.
# `var-naming[no-role-prefix]` finds the role's name from that path, so at the
# root of a repository it stays silent about a variable the role forgot to
# prefix.
ansible-lint-installed:
  image: docker.io/gwerlas/ansible-lint:26.11.0
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .config/**/*
          - .gitlab-ci.yml
          - defaults/**/*
          - jobs/ansible-lint-installed
          - meta/**/*
          - requirements.yml
          - tasks/**/*
          - vars/**/*
  script: jobs/ansible-lint-installed

# Upstream's own image, whose entrypoint is the linter itself: GitLab needs a
# shell as PID 1, hence the empty entrypoint. The rules live in
# .markdownlint.yaml.
markdownlint:
  image:
    name: docker.io/davidanson/markdownlint-cli2:v0.24.1
    entrypoint: [""]
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.md"
          - .gitlab-ci.yml
          - .markdownlint-cli2.yaml
          - .markdownlint.yaml
  script:
    - markdownlint-cli2 "**/*.md"

# Checks the fragments, which are what a contributor writes, then that
# CHANGELOG.md is what they generate. The image is the one that ships git,
# which `git diff` needs.
changelog:
  image: docker.io/library/python:3.15
  rules:
    - *on-default-branch
    - changes:
        compare_to: refs/heads/main
        paths:
          - .gitlab-ci.yml
          - CHANGELOG.md
          - changelogs/**/*
          - jobs/changelog
  before_script:
    - pip install --quiet antsibull-changelog==0.37.0
  script: jobs/changelog

# `jobs/` holds job scripts only, and each one is linted. On every pipeline,
# see `workflow:` above.
shellcheck:
  image: docker.io/koalaman/shellcheck-alpine:v0.11.0
  script:
    - shellcheck jobs/*

# A tag publishes what the changelog holds: the import below waits for this
# job, so a release nobody wrote down never reaches Galaxy.
changelog-release:
  image: docker.io/library/alpine:3.24
  rules:
    - if: $CI_COMMIT_TAG
  script: jobs/changelog-release

import:
  stage: deploy
  image: docker.io/gwerlas/ansible-core:2.22
  # Publishing must not be cancelled halfway through.
  interruptible: false
  needs:
    - changelog-release
  script: ansible-galaxy role import --token $GALAXY_TOKEN Gwerlas crew
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
